<!DOCTYPE html>
<html>
<head>
    <title>Perfil - EcoVision</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        background: linear-gradient(135deg, #0b1220, #111827);
        color: #e5e7eb;
    }

    /* NAVBAR */
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 25px;
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255,255,255,.08);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .logo {
        font-size: 24px;
        font-weight: bold;
        color: #60a5fa;
    }

    .menu {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .menu a {
        text-decoration: none;
        color: #e5e7eb;
        padding: 10px 15px;
        border-radius: 12px;
        background: rgba(255,255,255,.05);
        transition: .3s;
    }

    .menu a:hover {
        background: #60a5fa;
        color: #0b1220;
        transform: translateY(-2px);
    }

    .admin {
        background: #ef4444 !important;
        color: white !important;
    }

    /* CONTAINER */
    .container {
        padding: 30px;
        display: flex;
        justify-content: center;
    }

    /* CARD */
    .card {
        width: 600px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        padding: 25px;
        border-radius: 14px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
    }

    .card h1 {
        color: #93c5fd;
        margin-bottom: 10px;
    }

    .card p {
        color: #9ca3af;
        margin-bottom: 20px;
    }

    /* INPUTS */
    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: none;
        border-radius: 10px;
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 14px;
    }

    input::placeholder {
        color: #9ca3af;
    }

    input:focus {
        outline: none;
        border: 1px solid #60a5fa;
    }

    input[type="file"] {
        padding: 10px;
    }

    /* BOTÃO */
    .btn {
        width: 100%;
        background: #60a5fa;
        color: #0b1220;
        padding: 12px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .btn:hover {
        background: #3b82f6;
        transform: translateY(-2px);
    }

    .voltar {
        display: inline-block;
        margin-top: 15px;
        color: #93c5fd;
        text-decoration: none;
    }

    .voltar:hover {
        color: white;
    }
    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">
        🌱 EcoVision
    </div>

    <div class="menu">
        <a href="{% url 'cartoes' %}">Cartoes</a>
        <a href="{% url 'categorias' %}">Categorias</a>
        <a href="{% url 'contas' %}">Contas</a>
        <a href="{% url 'despesas' %}">Despesas</a>
        <a href="{% url 'receitas' %}">Receitas</a>
        <a href="{% url 'gastos_cartoes' %}">Gastos Cartão</a>
        <a href="{% url 'graficos' %}">Gráficos</a>
        <a href="{% url 'historico' %}">Histórico</a>
        <a href="{% url 'limites' %}">Limites</a>
        <a href="{% url 'metas' %}">Metas</a>
        <a href="{% url 'notificacoes' %}">Notificações</a>
        <a href="{% url 'recorrentes' %}">Recorrentes</a>
        <a href="{% url 'relatorios' %}">Relatórios</a>
        <a href="{% url 'saldos' %}">Saldos</a>
        <a href="{% url 'usuarios' %}">Usuários</a>
    </div>

</div>

<div class="container">

    <div class="card">

        <h1>👤 Perfil do Usuário</h1>

        <p>
            Atualize suas informações pessoais.
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input
                type="text"
                name="usuario"
                placeholder="👤 Nome de usuário"
            >

            <input
                type="file"
                name="foto_perfil"
                accept="image/*"
            >

            <input
                type="text"
                name="telefone"
                placeholder="📞 Ex: (35) 99999-9999"
            >

            <input
                type="text"
                name="endereco"
                placeholder="🏠 Ex: Rua X, 100, Centro"
            >

            <button class="btn" type="submit">
                Salvar Perfil
            </button>

        </form>

        <a class="voltar" href="{% url 'index' %}">
            ← Voltar ao Dashboard
        </a>

    </div>

</div>

</body>
</html>
